[workspace]
members = [
    "uniquity-common",
    "uniquity-gandola-manager",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
lariv-rs = { 
	# path = "../../lariv-rs",
	git = "https://github.com/lariv-in/lariv-rs", rev = "f30b3dd2c40260b6829227f3e5267eacb0cd1cc0",
	default-features = false, features = [
		"plugin-users",
		"plugin-dashboard",
		"plugin-filesystem",
		"plugin-otp",
		"plugin-pwa",
		"plugin-llm-assistant",
		"plugin-finance",
		"plugin-crm",
		"plugin-website",
] }
frunk = { version = "0.5.0", features = ["serde", "std"] }
frunk_core = "0.5.0"
tokio = { version = "1", features = ["full"] }
anyhow = { version = "1", features = ["backtrace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json",
    "with-rust_decimal",
] }
sea-orm-migration = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
async-trait = "0.1"
axum = { version = "0.8", features = ["form", "macros", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
maud = { version = "0.27", features = ["axum"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
rust_decimal = { version = "1", features = ["serde-with-str", "maths"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
thiserror = "2"
minijinja = { version = "2", features = ["serde"] }
num2words = "1"
sha2 = "0.10"
hex = "0.4"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = [
    "embedded-fonts",
    "scan-fonts",
    "system-files",
    "datetime",
] }
typst-syntax = "0.15.1"
comemo = "0.5.1"

uniquity-common = { path = "uniquity-common" }
uniquity-gandola-manager = { path = "uniquity-gandola-manager" }

[package]
name = "uniquity-ventures-rs"
version.workspace = true
edition.workspace = true

[[bin]]
name = "uniquity-ventures-rs"
path = "src/main.rs"

[dependencies]
lariv-rs = { workspace = true }
uniquity-gandola-manager = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
sea-orm = { workspace = true }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
axum = { workspace = true }
sea-orm = { workspace = true }
rust_decimal = { workspace = true }
chrono = { workspace = true }
urlencoding = "2"
lariv-rs = { workspace = true }
frunk = { workspace = true }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
