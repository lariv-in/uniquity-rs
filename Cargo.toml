[workspace]
members = [
    "uniquity-common",
    "uniquity-employees",
    "uniquity-finance-accounts",
    "uniquity-finance-customer",
    "uniquity-finance-creditnotes",
    "uniquity-finance-fiscal-year",
    "uniquity-finance-taxes",
    "uniquity-finance-products",
    "uniquity-finance-invoices",
    "uniquity-finance-indian",
    "uniquity-video",
    "uniquity-bin",
]
resolver = "2"
default-members = ["uniquity-bin"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
lariv-rs = { path = "../../lariv-rs", default-features = false, features = [
    "plugin-users",
    "plugin-dashboard",
    "plugin-filesystem",
    "plugin-otp",
    "plugin-pwa",
    "plugin-llm-assistant",
    "plugin-no-signup",
] }
frunk = { version = "0.5.0", features = ["serde", "std"] }
frunk_core = "0.5.0"
tokio = { version = "1", features = ["full"] }
anyhow = { version = "1", features = ["backtrace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json",
    "with-rust_decimal",
] }
sea-orm-migration = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
async-trait = "0.1"
axum = { version = "0.8", features = ["form", "macros", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
maud = { version = "0.27", features = ["axum"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
rust_decimal = { version = "1", features = ["serde-with-str", "maths"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
thiserror = "2"
minijinja = { version = "2", features = ["serde"] }
num2words = "1"
sha2 = "0.10"
hex = "0.4"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = [
    "embedded-fonts",
    "scan-fonts",
    "system-files",
    "datetime",
] }
typst-syntax = "0.15.1"
comemo = "0.5.1"

uniquity-common = { path = "uniquity-common" }
uniquity-employees = { path = "uniquity-employees" }
uniquity-finance-accounts = { path = "uniquity-finance-accounts" }
uniquity-finance-customer = { path = "uniquity-finance-customer" }
uniquity-finance-creditnotes = { path = "uniquity-finance-creditnotes" }
uniquity-finance-fiscal-year = { path = "uniquity-finance-fiscal-year" }
uniquity-finance-taxes = { path = "uniquity-finance-taxes" }
uniquity-finance-products = { path = "uniquity-finance-products" }
uniquity-finance-invoices = { path = "uniquity-finance-invoices" }
uniquity-finance-indian = { path = "uniquity-finance-indian" }
uniquity-video = { path = "uniquity-video" }

[profile.release]
lto = "thin"
strip = true
