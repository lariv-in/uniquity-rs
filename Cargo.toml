cargo-features = ["codegen-backend", "profile-rustflags"]

[workspace]
members = [
    "uniquity-common",
    "uniquity-gandola-manager",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Git pin for lariv. Local core work: scripts/lariv-source local
# Move this rev everywhere at once: scripts/lariv-source pin <40-char commit>
lariv-core = { version = "0.1.0", git = "https://github.com/lariv-in/lariv-rs.git", rev = "3d198ace7d69129e7c6038ec4cb66e1e4b2a0b35" }
lariv-plugin-contacts = { version = "0.1.0", git = "https://github.com/lariv-in/lariv-rs.git", rev = "3d198ace7d69129e7c6038ec4cb66e1e4b2a0b35" }
lariv-plugin-crm = { version = "0.1.0", git = "https://github.com/lariv-in/lariv-rs.git", rev = "3d198ace7d69129e7c6038ec4cb66e1e4b2a0b35" }
lariv-plugin-customer = { version = "0.1.0", git = "https://github.com/lariv-in/lariv-rs.git", rev = "3d198ace7d69129e7c6038ec4cb66e1e4b2a0b35" }
lariv-plugin-dashboard = { version = "0.1.0", git = "https://github.com/lariv-in/lariv-rs.git", rev = "3d198ace7d69129e7c6038ec4cb66e1e4b2a0b35" }
lariv-plugin-filesystem = { version = "0.1.0", git = "https://github.com/lariv-in/lariv-rs.git", rev = "3d198ace7d69129e7c6038ec4cb66e1e4b2a0b35" }
lariv-plugin-finance-accounts = { version = "0.1.0", git = "https://github.com/lariv-in/lariv-rs.git", rev = "3d198ace7d69129e7c6038ec4cb66e1e4b2a0b35" }
lariv-plugin-finance-common = { version = "0.1.0", git = "https://github.com/lariv-in/lariv-rs.git", rev = "3d198ace7d69129e7c6038ec4cb66e1e4b2a0b35" }
lariv-plugin-finance-creditnotes = { version = "0.1.0", git = "https://github.com/lariv-in/lariv-rs.git", rev = "3d198ace7d69129e7c6038ec4cb66e1e4b2a0b35" }
lariv-plugin-finance-indian = { version = "0.1.0", git = "https://github.com/lariv-in/lariv-rs.git", rev = "3d198ace7d69129e7c6038ec4cb66e1e4b2a0b35" }
lariv-plugin-finance-invoices = { version = "0.1.0", git = "https://github.com/lariv-in/lariv-rs.git", rev = "3d198ace7d69129e7c6038ec4cb66e1e4b2a0b35" }
lariv-plugin-finance-products = { version = "0.1.0", git = "https://github.com/lariv-in/lariv-rs.git", rev = "3d198ace7d69129e7c6038ec4cb66e1e4b2a0b35" }
lariv-plugin-finance-taxes = { version = "0.1.0", git = "https://github.com/lariv-in/lariv-rs.git", rev = "3d198ace7d69129e7c6038ec4cb66e1e4b2a0b35" }
lariv-plugin-llm-assistant = { version = "0.1.0", git = "https://github.com/lariv-in/lariv-rs.git", rev = "3d198ace7d69129e7c6038ec4cb66e1e4b2a0b35" }
lariv-plugin-otp = { version = "0.1.0", git = "https://github.com/lariv-in/lariv-rs.git", rev = "3d198ace7d69129e7c6038ec4cb66e1e4b2a0b35" }
lariv-plugin-pwa = { version = "0.1.0", git = "https://github.com/lariv-in/lariv-rs.git", rev = "3d198ace7d69129e7c6038ec4cb66e1e4b2a0b35" }
lariv-plugin-tasks = { version = "0.1.0", git = "https://github.com/lariv-in/lariv-rs.git", rev = "3d198ace7d69129e7c6038ec4cb66e1e4b2a0b35" }
lariv-plugin-users = { version = "0.1.0", git = "https://github.com/lariv-in/lariv-rs.git", rev = "3d198ace7d69129e7c6038ec4cb66e1e4b2a0b35" }
lariv-plugin-website = { version = "0.1.0", git = "https://github.com/lariv-in/lariv-rs.git", rev = "3d198ace7d69129e7c6038ec4cb66e1e4b2a0b35" }
frunk = { version = "0.5.0", features = ["serde", "std"] }
frunk_core = "0.5.0"
tokio = { version = "1", features = ["full"] }
anyhow = { version = "1", features = ["backtrace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sea-orm = { version = "2.0", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json",
    "with-rust_decimal",
] }
sea-orm-migration = { version = "2.0", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
async-trait = "0.1"
axum = { version = "0.8", features = ["form", "macros", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
maud = { version = "0.27", features = ["axum"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
rust_decimal = { version = "1", features = ["serde-with-str", "maths"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
thiserror = "2"
minijinja = { version = "2", features = ["serde"] }
num2words = "1"
sha2 = "0.10"
hex = "0.4"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = [
    "embedded-fonts",
    "scan-fonts",
    "system-files",
    "datetime",
] }
typst-syntax = "0.15.1"
comemo = "0.5.1"

uniquity-common = { path = "uniquity-common" }
uniquity-gandola-manager = { path = "uniquity-gandola-manager" }

[package]
name = "uniquity-ventures-rs"
version.workspace = true
edition.workspace = true

[[bin]]
name = "uniquity-ventures-rs"
path = "src/main.rs"

[dependencies]
lariv-rs = { version = "0.1.0", git = "https://github.com/lariv-in/lariv-rs.git", rev = "3d198ace7d69129e7c6038ec4cb66e1e4b2a0b35", default-features = false, features = [
	"plugin-users",
	"plugin-dashboard",
	"plugin-filesystem",
	"plugin-otp",
	"plugin-pwa",
	"plugin-llm-assistant",
	"plugin-finance",
	"plugin-crm",
	"plugin-contacts",
	"plugin-tasks",
	"plugin-website",
] }
lariv-core = { workspace = true }
lariv-plugin-contacts = { workspace = true }
lariv-plugin-filesystem = { workspace = true }
lariv-plugin-finance-accounts = { workspace = true }
lariv-plugin-finance-creditnotes = { workspace = true }
lariv-plugin-finance-invoices = { workspace = true }
lariv-plugin-finance-products = { workspace = true }
lariv-plugin-finance-taxes = { workspace = true }
lariv-plugin-llm-assistant = { workspace = true }
lariv-plugin-users = { workspace = true }
lariv-plugin-website = { workspace = true }
uniquity-gandola-manager = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
frunk = { workspace = true }
frunk_core = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
axum = { workspace = true }
sea-orm = { workspace = true }
rust_decimal = { workspace = true }
chrono = { workspace = true }
urlencoding = "2"
lariv-core = { workspace = true }
lariv-plugin-contacts = { workspace = true }
lariv-plugin-crm = { workspace = true }
lariv-plugin-customer = { workspace = true }
lariv-plugin-dashboard = { workspace = true }
lariv-plugin-filesystem = { workspace = true }
lariv-plugin-finance-accounts = { workspace = true }
lariv-plugin-finance-creditnotes = { workspace = true }
lariv-plugin-finance-indian = { workspace = true }
lariv-plugin-finance-invoices = { workspace = true }
lariv-plugin-finance-products = { workspace = true }
lariv-plugin-finance-taxes = { workspace = true }
lariv-plugin-llm-assistant = { workspace = true }
lariv-plugin-otp = { workspace = true }
lariv-plugin-pwa = { workspace = true }
lariv-plugin-tasks = { workspace = true }
lariv-plugin-users = { workspace = true }
lariv-plugin-website = { workspace = true }
frunk = { workspace = true }

[profile.dev]
debug = 0
codegen-backend = "cranelift"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
