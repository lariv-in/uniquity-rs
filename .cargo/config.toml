[env]
# Debug builds use Cranelift. aws-lc-sys only notices that backend when it
# appears in rustflags, so the profile setting alone still emits `\x01`
# link names that Cranelift does not strip. These bindings use the plain
# C symbol names, which match libaws_lc_*_crypto.a.
AWS_LC_SYS_NO_U1_BINDINGS = "1"
