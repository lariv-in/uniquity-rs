name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-27
          components: rustc-codegen-cranelift-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo check --workspace

  # GitHub only restores caches from the current ref or the default branch.
  # Tag releases cannot see caches saved on previous tags, so warm Release-Cache
  # on master and let the tag job restore it.
  release-cache:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-27
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: Release-Cache
          add-rust-environment-hash-key: false
          cache-workspace-crates: true
          cache-on-failure: true
      - run: cargo build --release
